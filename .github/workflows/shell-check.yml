name: Repository Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    name: Shell Script Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          python3 --version

      - name: Validate JSON configuration files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find environment node -type f -name '*.json' -print | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No JSON configuration files found."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Validating JSON: $file"
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Find shell scripts
        id: scripts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scripts < <(
            find .               -type d \( -name .git -o -name node_modules -o -name dist \) -prune               -o -type f \( -name '*.sh' -o -name '*.bash' \) -print |
              sort
          )

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No standalone .sh or .bash files found."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf 'Found %s shell script(s):\n' "${#scripts[@]}"
            printf '%s\n' "${scripts[@]}"
          fi

      - name: Check Bash syntax
        if: steps.scripts.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking Bash syntax: $file"
            bash -n "$file"
          done < <(
            find .               -type d \( -name .git -o -name node_modules -o -name dist \) -prune               -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0
          )

      - name: Run ShellCheck
        if: steps.scripts.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          find .             -type d \( -name .git -o -name node_modules -o -name dist \) -prune             -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 |
            xargs -0 -r shellcheck

      - name: Check shell formatting
        if: steps.scripts.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          find .             -type d \( -name .git -o -name node_modules -o -name dist \) -prune             -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 |
            xargs -0 -r shfmt -d -i 4

      - name: Report success
        run: echo "All configured repository quality checks passed."
